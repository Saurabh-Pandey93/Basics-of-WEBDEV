<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>studying table</title>
</head>
<body>
    <table border="red" >
        <caption>
            <thead>
            <tr>
                <th rowspan="2">Item</th>
                <th colspan="2">Price</th>

            </tr> 
            <tH>INR </tH>   
            <tH>USD </tH>   
            </thead>
        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
                <td>0.10</td>
            </tr>
            <tr>
                <td>Samosa</td>
                <td>15</td>
                <td>0.15</td>
            </tr>
            <tr>
                <td>Chips</td>
                <td>20</td>
                <td>0.20</td>
        </tr>

        </tbody>
        </caption>
    </table>
</body>
</html>
<!-- Colspan and rowspan attributes used to create cells which spans over multiple rows or columns -->
